<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <div class="brand">QuickWash</div>
    <div class="links">
      <a href="dashboard.html">Dashboard</a>
      <a href="product.html">Services</a>
      <a href="orderTracking.html">Order Tracking</a>
    </div>
  </nav>

  <div class="container" style="max-width:700px;">
    <div class="card">
      <h2>Contact Us</h2>
      <input id="name" placeholder="Name">
      <input id="email" placeholder="Email">
      <textarea id="message" placeholder="Message" rows="5"></textarea>
      <button onclick="sendMessage()">Send</button>
      <p id="result" class="muted" style="margin-top:12px;"></p>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    function sendMessage() {
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const message = document.getElementById('message').value.trim();
      if (!name || !email || !message) return alert('Please fill all fields');
      document.getElementById('result').textContent = 'Message sent successfully. Our team will contact you soon.';
      document.getElementById('name').value = '';
      document.getElementById('email').value = '';
      document.getElementById('message').value = '';
    }
  </script>
</body>
</html>
